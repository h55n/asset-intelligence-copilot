<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Intelligence Copilot - chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f4ef; --side:#edeae2; --ink:#1f1b16; --soft:#55504a; --grey:#8d867c;
    --line:#e2ddd1; --line2:#d5cfbf; --card:#ffffff; --bubble:#eae5d9; --accent:#c9633c;
    --serif:"Instrument Serif",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  a { color:inherit; }
  html, body { height:100%; }
  body { font-family:var(--sans); background:var(--bg); color:var(--ink); display:flex; -webkit-font-smoothing:antialiased; }

  aside { width:264px; flex:none; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; }
  aside .word { font:400 21px var(--serif); padding:4px 8px 16px; text-decoration:none; display:block; }
  aside .word em { font-style:italic; color:var(--accent); }
  .newchat { display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:1px solid var(--line2);
             border-radius:999px; padding:10px 16px; font:500 13px var(--sans); color:var(--ink); cursor:pointer; }
  .newchat:hover { background:#e6e2d8; }
  .newchat b { font-weight:400; font-size:16px; line-height:1; }
  aside .sect { font:500 10.5px var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--grey); margin:20px 10px 6px; }
  .conv { display:block; width:100%; text-align:left; background:transparent; border:0; border-radius:10px; padding:8px 10px;
          font:400 12.5px/1.4 var(--sans); color:var(--soft); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv:hover { background:#e6e2d8; color:var(--ink); }
  aside .spacer { flex:1; }
  .me { display:flex; align-items:center; gap:10px; padding:10px; border-top:1px solid var(--line2); }
  .me .av { width:30px; height:30px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:600 11px var(--sans); flex:none; }
  .me select { flex:1; min-width:0; background:transparent; border:0; font:500 12.5px var(--sans); color:var(--ink); cursor:pointer; }
  .me select:focus { outline:none; }

  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; gap:12px; padding:16px 24px 10px; }
  .topbar .t { font:400 17px var(--serif); }
  .topbar .badge { font:500 10.5px var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--grey); border:1px solid var(--line2); border-radius:999px; padding:5px 12px; }
  .topbar .badge b { color:var(--accent); font-weight:600; }
  .topbar .home { margin-left:auto; font:500 12.5px var(--sans); color:var(--grey); text-decoration:none; }
  .topbar .home:hover { color:var(--ink); }

  #chips { display:none; gap:8px; padding:6px 16px 2px; overflow-x:auto; }
  #chips .conv { white-space:nowrap; overflow:visible; text-overflow:clip; border:1px solid var(--line2); border-radius:999px; padding:7px 14px; width:auto; flex:none; }

  #scroll { flex:1; overflow-y:auto; }
  #col { max-width:760px; margin:0 auto; padding:24px 24px 20px; display:flex; flex-direction:column; gap:26px; }
  #scroll::-webkit-scrollbar { width:8px; }
  #scroll::-webkit-scrollbar-thumb { background:var(--line2); border-radius:4px; }

  .msg.user { align-self:flex-end; background:var(--bubble); border-radius:20px; padding:11px 18px; max-width:78%;
              font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .msg.bot { align-self:flex-start; width:100%; font-size:15px; line-height:1.75; }
  .msg.bot .ans b { font-weight:600; }
  .msg.bot.thinking { color:var(--grey); font-style:italic; }
  .msg.bot.thinking .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:8px; animation:p 1s infinite alternate; }
  @keyframes p { from { opacity:.3; } to { opacity:1; } }

  .cites { margin-top:12px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .cites .lbl { font:500 10px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--grey); margin-right:2px; }
  .cite { font:500 11px var(--mono); background:#f0ede4; border:1px solid var(--line); color:var(--soft); padding:4px 11px; border-radius:999px; cursor:pointer; }
  .cite:hover { border-color:var(--ink); color:var(--ink); }

  .calls { margin-top:10px; font-size:12px; color:var(--grey); }
  .calls summary { cursor:pointer; list-style:none; font:500 10.5px var(--sans); letter-spacing:.12em; text-transform:uppercase; }
  .calls summary:hover { color:var(--ink); }
  .calls summary::before { content:'\25B8 '; }
  .calls[open] summary::before { content:'\25BE '; }
  .calls .tool { font:500 11px var(--mono); color:var(--soft); background:#f0ede4; border:1px solid var(--line); border-radius:8px; padding:3px 9px; margin:6px 6px 0 0; display:inline-block; }

  .viz { margin-top:14px; }
  .viz .vt { font:400 19px var(--serif); margin-bottom:10px; }
  table.data { border-collapse:collapse; font-size:12.5px; background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  table.data th, table.data td { border:1px solid var(--line); padding:8px 14px; text-align:left; }
  table.data th { background:#f0ede4; font-weight:600; font-size:12px; }
  .card.v { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 22px; display:inline-block; min-width:250px; }
  .card .big { font:400 20px var(--serif); margin:2px 0 10px; }
  .card .ok { color:#3d7a4f; } .card .down { color:#b0432e; }
  canvas { background:var(--card); border:1px solid var(--line); border-radius:14px; max-width:100%; height:auto; }
  .fu { margin-top:10px; color:var(--accent); font-size:13.5px; }

  #empty { margin:auto; text-align:center; max-width:680px; padding:8vh 24px 20px; }
  #empty h2 { font:400 clamp(34px,4.6vw,46px)/1.1 var(--serif); margin-bottom:14px; }
  #empty h2 em { font-style:italic; color:var(--accent); }
  #empty p { color:var(--soft); font-size:14px; line-height:1.7; margin-bottom:34px; }
  #empty .cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; }
  .ecard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; cursor:pointer; }
  .ecard:hover { border-color:var(--ink); }
  .ecard .t { font:500 10.5px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:7px; }
  .ecard .qq { font:400 13.5px/1.5 var(--sans); color:var(--ink); }

  #composer { flex:none; padding:12px 24px 18px; }
  #cbox { max-width:760px; margin:0 auto; background:var(--card); border:1px solid var(--line2); border-radius:26px; padding:8px 10px 8px 22px;
          display:flex; gap:10px; align-items:center; box-shadow:0 2px 14px rgba(60,45,25,.06); }
  #cbox:focus-within { border-color:#c9c0ab; box-shadow:0 2px 18px rgba(60,45,25,.1); }
  #cbox input { flex:1; background:transparent; border:0; color:var(--ink); font:400 14.5px var(--sans); padding:10px 0; outline:none; }
  #cbox input::placeholder { color:var(--grey); }
  #send { width:38px; height:38px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:17px; cursor:pointer; flex:none; line-height:1; }
  #send:hover { background:#b5562f; }
  #send:disabled { background:var(--line2); cursor:default; }
  #fine { max-width:760px; margin:8px auto 0; text-align:center; font:400 11px var(--sans); color:var(--grey); }

  @media (max-width:640px) {
    .topbar .badge { display:none; }
    .topbar .t { font-size:15px; }
  }
  @media (max-width:900px) {
    aside { display:none; }
    #chips { display:flex; }
    #col { padding:16px 16px 12px; }
    #composer { padding:10px 12px 12px; }
    #empty .cards { grid-template-columns:1fr; }
  }

  .msg.bot.err .ans { color:#9a3f2c; }
  .conv.active { background:#e2ddcf; color:var(--ink); }
  #col { gap:30px; }
  .msg.bot { font-size:15.5px; }
  .msg.bot.thinking .dot { margin-right:10px; }
</style>
</head>
<body>

<aside>
  <a class="word" href="/">Asset <em>Intelligence</em></a>
  <button class="newchat" onclick="newChat()"><b>+</b> New chat</button>
  <div class="sect">Production</div><div data-q="prod"></div>
  <div class="sect">Spills &amp; repairs</div><div data-q="spill"></div>
  <div class="sect">Compliance</div><div data-q="comp"></div>
  <div class="spacer"></div>
  <div class="me"><div class="av" id="av">--</div><select id="userPicker"></select></div>
</aside>

<main>
  <div class="topbar">
    <span class="t">Asset Intelligence Copilot</span>
    <span class="badge">field data &middot; <b id="wellCount">live</b></span>
    <a class="home" href="/">&larr; home</a>
  </div>
  <div id="chips"></div>
  <div id="scroll"><div id="col"></div></div>
  <div id="composer">
    <div id="cbox">
      <input id="q" placeholder="Ask about a well, downtime, spills, compliance - or tell me something to remember..." autofocus>
      <button id="send" title="Send">&#8593;</button>
    </div>
    <div id="fine">every answer verified against the records - cited, always</div>
  </div>
</main>

<script>
let USER = null, SESSION = null, PRELOAD = {};
fetch('/static/preload.json').then(r => r.ok ? r.json() : {}).then(j => { PRELOAD = j; }).catch(() => {});
const col = document.getElementById('col');
const scrollEl = document.getElementById('scroll');

const QUICK = {
  prod: ["Which wells are not producing right now?", "Is WELL-0001 producing oil? Why?", "Show a map of all wells that are down", "Compare downtime across wells this quarter"],
  spill: ["Any spills in the last 90 days? How much oil?", "Which spills were not contained within 24 hours?", "Show a heatmap of spills by area and month", "Which wells have repeat spill problems?"],
  comp: ["Which rules has WELL-0001 broken in the last year?", "Any overdue spill reports or repairs?", "Show this week's inspection compliance", "Which wells need a root cause analysis?"]
};

function buildQuick() {
  const mk = (q) => { const b = el('button', 'conv'); b.textContent = q; b.title = q; b.onclick = () => ask(q); return b; };
  for (const [k, qs] of Object.entries(QUICK)) {
    const host = document.querySelector(`[data-q="${k}"]`);
    qs.forEach(q => host.appendChild(mk(q)));
  }
  const chips = document.getElementById('chips');
  [...QUICK.prod, ...QUICK.spill, ...QUICK.comp].slice(0, 8).forEach(q => chips.appendChild(mk(q)));
}

async function loadUsers() {
  const r = await fetch('/api/users').then(r => r.json());
  const sel = document.getElementById('userPicker');
  sel.innerHTML = r.users.map(u => `<option value="${u.user_id}">${u.name} &middot; ${u.role.replace(/_/g,' ')}</option>`).join('');
  USER = localStorage.getItem('aic_user') || r.users[0].user_id;
  sel.value = USER;
  sel.onchange = () => { USER = sel.value; SESSION = null; localStorage.setItem('aic_user', USER); setAv(); };
  setAv();
  const wc = document.getElementById('wellCount');
  if (r.well_count) wc.textContent = r.well_count + ' wells live';
}
function setAv() {
  const t = document.getElementById('userPicker').selectedOptions[0];
  const name = t ? t.textContent.split(' ').slice(0,2) : ['?'];
  document.getElementById('av').textContent = name.map(w => w[0]).join('').toUpperCase();
}
function newChat() { SESSION = null; col.innerHTML = ''; showEmpty(); }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function md(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
          .replace(/\n/g, '<br>');
}

function renderViz(v) {
  if (!v || !v.type || v.type === 'none') return null;
  const wrap = el('div', 'viz');
  if (v.title) wrap.appendChild(el('div', 'vt', v.title));
  const d = v.data || {};
  if (v.type === 'card') {
    const c = el('div', 'card v');
    const prod = d.producing ?? d.producing_now ?? d.status;
    if (prod !== undefined) c.appendChild(el('div', 'big ' + ((prod === true || /producing/i.test(String(prod)) && !/not/i.test(String(prod))) ? 'ok' : 'down'), (typeof prod === 'boolean' ? (prod ? 'Producing' : 'Not producing') : String(prod))));
    for (const [k, val] of Object.entries(d)) {
      if (['producing','producing_now','status'].includes(k)) continue;
      const row = el('div'); row.style.fontSize = '13px'; row.style.marginTop = '3px'; row.style.color = 'var(--soft)';
      row.textContent = k.replace(/_/g,' ') + ': ' + val;
      c.appendChild(row);
    }
    wrap.appendChild(c);
  } else if (v.type === 'table') {
    if (!(d.columns||[]).length || !(d.rows||[]).length) return null;
    const t = el('table', 'data');
    const tr = el('tr'); (d.columns||[]).forEach(c => tr.appendChild(el('th', null, c))); t.appendChild(tr);
    (d.rows||[]).forEach(r => { const tr2 = el('tr'); r.forEach(c => tr2.appendChild(el('td', null, String(c)))); t.appendChild(tr2); });
    wrap.appendChild(t);
  } else if (v.type === 'line') {
    if (!(d.series||[]).length || !(d.x||[]).length) return null;
    const cv = el('canvas'); cv.width = 720; cv.height = 300; wrap.appendChild(cv); drawLine(cv, d);
  } else if (v.type === 'bar') {
    if (!(d.values||[]).length) return null;
    const cv = el('canvas'); cv.width = 600; cv.height = 300; wrap.appendChild(cv); drawBar(cv, d);
  } else if (v.type === 'map') {
    const cv = el('canvas'); cv.width = 620; cv.height = 420; wrap.appendChild(cv); drawMap(cv, d);
  } else if (v.type === 'heatmap') {
    if (!(d.rows||[]).length || !(d.cols||[]).length) return null;
    const cv = el('canvas'); cv.width = 720; cv.height = 60 + 30 * ((d.rows||[]).length); wrap.appendChild(cv); drawHeat(cv, d);
  }
  return wrap;
}

const COLORS = ['#c9633c','#2e5e4e','#8d6b3f','#5b6b8c'];
const AXTXT = '#8d867c', AXLINE = '#e2ddd1';
function axes(ctx, w, h, pad) {
  ctx.strokeStyle = AXLINE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, 10); ctx.lineTo(pad, h-pad); ctx.lineTo(w-10, h-pad); ctx.stroke();
}
function drawLine(cv, d) {
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height, pad = 42;
  const xs = d.x || [], series = d.series || [];
  const allY = series.flatMap(s => s.y);
  const min = Math.min(...allY) - 2, max = Math.max(...allY) + 2;
  const X = i => pad + (w - pad - 20) * (xs.length < 2 ? 0 : i / (xs.length - 1));
  const Y = v => h - pad - (h - pad - 20) * (v - min) / (max - min || 1);
  axes(ctx, w, h, pad);
  ctx.fillStyle = AXTXT; ctx.font = '10px Inter, sans-serif';
  for (let i = 0; i < xs.length; i += Math.ceil(xs.length/8)) ctx.fillText(xs[i].slice(5), X(i)-12, h-pad+14);
  for (let v = Math.ceil(min); v <= max; v += Math.ceil((max-min)/5)) ctx.fillText(v, 6, Y(v)+3);
  series.forEach((s, si) => {
    ctx.strokeStyle = COLORS[si % 4]; ctx.lineWidth = 2; ctx.beginPath();
    s.y.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))); ctx.stroke();
    ctx.fillStyle = COLORS[si % 4]; ctx.fillText(s.label, pad + 8, 22 + 13*si);
  });
  (d.markers || []).forEach(mk => {
    const i = xs.indexOf(mk.x); if (i < 0) return;
    ctx.fillStyle = '#b0432e'; ctx.beginPath(); ctx.arc(X(i), 22, 4, 0, 7); ctx.fill();
    ctx.fillText(mk.label || 'not producing', X(i) + 8, 26);
  });
}
function drawBar(cv, d) {
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height, pad = 42;
  const labels = d.labels || [], vals = d.values || [];
  const max = Math.max(...vals, 1);
  axes(ctx, w, h, pad);
  const bw = (w - pad - 30) / vals.length;
  vals.forEach((v, i) => {
    const bh = (h - pad - 30) * v / max;
    ctx.fillStyle = COLORS[i % 4];
    ctx.fillRect(pad + i*bw + 8, h - pad - bh, bw - 16, bh);
    ctx.fillStyle = '#1f1b16'; ctx.font = '11px Inter, sans-serif';
    ctx.fillText(v, pad + i*bw + bw/2 - 8, h - pad - bh - 6);
    ctx.fillStyle = AXTXT; ctx.fillText(labels[i].replace('WELL-','W'), pad + i*bw + 8, h - pad + 14);
  });
}
function drawMap(cv, d) {
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
  const pins = d.pins || [];
  if (!pins.length) return;
  const lats = pins.map(p => p.lat), lons = pins.map(p => p.lon);
  const pad = 40;
  const minLa = Math.min(...lats) - 0.01, maxLa = Math.max(...lats) + 0.01;
  const minLo = Math.min(...lons) - 0.01, maxLo = Math.max(...lons) + 0.01;
  const X = lo => pad + (w - 2*pad) * (lo - minLo) / (maxLo - minLo || 1);
  const Y = la => h - pad - (h - 2*pad) * (la - minLa) / (maxLa - minLa || 1);
  ctx.strokeStyle = '#ede9dd';
  for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(pad + i*(w-2*pad)/8, pad); ctx.lineTo(pad + i*(w-2*pad)/8, h-pad); ctx.stroke();
                                ctx.beginPath(); ctx.moveTo(pad, pad + i*(h-2*pad)/8); ctx.lineTo(w-pad, pad + i*(h-2*pad)/8); ctx.stroke(); }
  pins.forEach(p => {
    ctx.fillStyle = '#b0432e'; ctx.beginPath(); ctx.arc(X(p.lon), Y(p.lat), 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#1f1b16'; ctx.font = '11px Inter, sans-serif';
    ctx.fillText(p.well + (p.label ? ' (' + p.label + ')' : ''), X(p.lon) + 10, Y(p.lat) + 4);
  });
}
function drawHeat(cv, d) {
  const ctx = cv.getContext('2d');
  const rows = d.rows || [], cols = d.cols || [], vals = d.values || [];
  const cw = Math.min(60, (cv.width - 170) / cols.length), ch = 28, x0 = 160, y0 = 34;
  const max = Math.max(...vals.flat(), 1);
  ctx.font = '11px Inter, sans-serif';
  cols.forEach((c, j) => { ctx.fillStyle = AXTXT; ctx.fillText(c, x0 + j*cw + 8, 22); });
  rows.forEach((r, i) => {
    ctx.fillStyle = AXTXT; ctx.fillText(r, 8, y0 + i*ch + 18);
    (vals[i] || []).forEach((v, j) => {
      const a = v / max;
      ctx.fillStyle = `rgba(201, 99, 60, ${0.08 + 0.8*a})`;
      ctx.fillRect(x0 + j*cw, y0 + i*ch, cw - 2, ch - 2);
      ctx.fillStyle = a > 0.55 ? '#ffffff' : '#1f1b16';
      ctx.fillText(v, x0 + j*cw + cw/2 - 6, y0 + i*ch + 18);
    });
  });
}

function showEmpty() {
  const e = el('div'); e.id = 'empty';
  e.innerHTML = `<h2>Ask the field <em>anything.</em></h2>
    <p>Answers come straight from the live well records - inspections, temperatures, spills, repairs and compliance - with the exact records cited. You can also tell me field updates to remember, like a corrected temperature.</p>
    <div class="cards">
      <div class="ecard" data-qq="Is WELL-0001 producing oil right now? Why?"><div class="t">Production</div><div class="qq">Is WELL-0001 producing oil right now? Why?</div></div>
      <div class="ecard" data-qq="Which spills in the last 90 days were not contained in time?"><div class="t">Spills</div><div class="qq">Which recent spills were not contained in time?</div></div>
      <div class="ecard" data-qq="Show a map of all wells that are not producing."><div class="t">Map</div><div class="qq">Show a map of all wells that are down</div></div>
      <div class="ecard" data-qq="Any overdue spill reports or repairs?"><div class="t">Compliance</div><div class="qq">Any overdue spill reports or repairs?</div></div>
    </div>`;
  e.querySelectorAll('.ecard').forEach(c => c.onclick = () => ask(c.dataset.qq));
  col.appendChild(e);
}

function addMsg(role, text, payload) {
  const emp = document.getElementById('empty'); if (emp) emp.remove();
  const m = el('div', 'msg ' + (role === 'user' ? 'user' : 'bot'));
  if (role === 'user') { m.innerHTML = md(text); }
  else {
    const ans = el('div', 'ans'); ans.innerHTML = md(text); m.appendChild(ans);
    if (payload && payload.viz) { const v = renderViz(payload.viz); if (v) ans.appendChild(v); }
    if (payload && payload.citations && payload.citations.length) {
      const cs = el('div', 'cites'); cs.appendChild(el('span', 'lbl', 'evidence'));
      payload.citations.forEach(c => {
        const chip = el('span', 'cite', c);
        chip.title = 'ask for the full record';
        chip.onclick = () => ask(`Show me the full record ${c}`);
        cs.appendChild(chip);
      });
      ans.appendChild(cs);
    }
    if (payload && payload.calls && payload.calls.length) {
      const det = el('details', 'calls');
      const names = payload.calls.map(c => c.tool);
      det.appendChild(el('summary', null, `verified against the records (${names.length} lookup${names.length>1?'s':''})`));
      names.forEach(n => det.appendChild(el('span', 'tool', n)));
      ans.appendChild(det);
    }
    if (payload && payload.follow_up) { const f = el('div', 'fu'); f.innerHTML = md(payload.follow_up); ans.appendChild(f); }
  }
  col.appendChild(m); scrollEl.scrollTop = scrollEl.scrollHeight;
  return m;
}

let THINK_TIMER = null;
async function ask(text) {
  if (!text || !USER) return;
  const inp = document.getElementById('q'); inp.value = '';
  document.querySelectorAll('.conv').forEach(c => c.classList.toggle('active', c.textContent === text));
  const pre = PRELOAD[text];
  if (pre) {
    addMsg('user', text);
    addMsg('bot', pre.answer || '(no answer)', pre);
    return;
  }
  document.getElementById('send').disabled = true;
  addMsg('user', text);
  const thinking = addMsg('bot', 'checking the records...');
  thinking.classList.add('thinking');
  const ansEl = thinking.querySelector('.ans');
  ansEl.insertAdjacentHTML('afterbegin', '<span class="dot"></span>');
  const t0 = Date.now();
  THINK_TIMER = setInterval(() => { ansEl.innerHTML = '<span class="dot"></span>checking the records... ' + Math.round((Date.now()-t0)/1000) + 's'; }, 1000);
  const ctl = new AbortController();
  const killer = setTimeout(() => ctl.abort(), 55000);
  try {
    const res = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: USER, session_id: SESSION, message: text}), signal: ctl.signal});
    const r = await res.json().catch(() => ({error: 'The service returned an unreadable response (HTTP ' + res.status + '). Please try again.'}));
    clearTimeout(killer); clearInterval(THINK_TIMER);
    thinking.remove();
    if (r.error || !res.ok) { const m = addMsg('bot', r.error || ('Something went wrong (HTTP ' + res.status + '). Please try again.')); m.classList.add('err'); return; }
    SESSION = r.session_id;
    addMsg('bot', r.answer || '(no answer)', r);
  } catch (e) {
    clearTimeout(killer); clearInterval(THINK_TIMER);
    thinking.remove();
    const msg = (e && e.name === 'AbortError') ? 'That took too long and timed out - the service may be busy. Please try again.' : 'Network error - please check your connection and try again.';
    const m = addMsg('bot', msg); m.classList.add('err');
  } finally {
    document.getElementById('send').disabled = false;
    document.getElementById('q').focus();
  }
}
function send() { ask(document.getElementById('q').value.trim()); }
document.getElementById('send').onclick = send;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
buildQuick();
loadUsers();
showEmpty();
const qp = new URLSearchParams(location.search).get('q');
if (qp) { setTimeout(() => ask(qp), 400); }
</script>
